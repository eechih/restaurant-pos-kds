version: 1
backend:
  phases:
    build:
      commands:
        # Not npm ci: it rejects this lockfile, because Amplify's packages bundle
        # dependencies that npm reports as missing. npm install still installs
        # the locked versions.
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
